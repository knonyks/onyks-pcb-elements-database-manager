services:

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
        - ./proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - frontend
      - svn
      - backend

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ${CONFIG_FILE:-.env}
    depends_on:
      - database
    volumes:
      - ${SVN_DATA_PATH}/${SVN_REPO_NAME}:/local_svn

  database:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    env_file: ${CONFIG_FILE:-.env}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data
      # - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

  svn:
    build: ./svn
    restart: unless-stopped
    env_file: ${CONFIG_FILE:-.env}
    ports:
      - "${SVN_PORT}:443"
    volumes:
      - ${SVN_DATA_PATH}:/var/svn
    depends_on:
      - database